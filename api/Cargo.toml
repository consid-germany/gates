[package]
name = "gates-api"
version = "1.3.3"
edition = "2021"
license = "MIT"
authors = ["Consid Germany"]

[features]
local = []
date_time_switch = []

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1

[dependencies]
lambda_http = "1.2.1"
lambda_runtime = "1.2.1"
tokio = { version = "1.52.3", features = ["macros"] }
tracing = { version = "0.1.44", features = ["log"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt"] }
openapi = { path = "./openapi" }

axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
chrono = { version = "0.4.45", features = ["serde"] }
aws-sdk-dynamodb = "1.116.0"
aws-config = "1.8.18"
itertools = "0.15.0"
tower-http = { version = "0.7.0", features = ["trace"] }
cuid2 = "0.1.6"
async-trait = "0.1.89"

openssl = { version = "0.10.75", features = ["vendored"] }
ring = "0.17.14"

[dev-dependencies]
axum-test = "18.2.1"
http-body-util = "0.1.3"
similar-asserts = "1.7.0"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["dynamodb"] }
mockall = "0.13.1"
rstest = "0.26.1"
